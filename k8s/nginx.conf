# Static explainer behind one shared basic-auth login.
# Runs as non-root with a read-only root filesystem; only /tmp is writable.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index sony-invoice-explainer.html;
        absolute_redirect off;

        auth_basic "Sony invoice explainer";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            auth_basic off;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The explainer links to architecture.md; open the readable page generated from it.
        location = /architecture.md {
            return 302 /architecture.html;
        }
    }
}
